let course="html",idx=0,lang="en",xp=+localStorage.getItem("webquest_xp")||0;
let done=JSON.parse(localStorage.getItem("webquest_done")||"{}");
function key(){return course+"_"+idx} function L(){return data[course][idx]} function tr(a){return a[lang==="en"?0:1]}
function save(){localStorage.setItem("webquest_xp",xp);localStorage.setItem("webquest_done",JSON.stringify(done))}
function renderCourses(){document.querySelectorAll(".course").forEach(b=>b.classList.toggle("active",b.dataset.course===course))}
function renderMissions(){
 const arr=data[course]; const set=done[course]||[];
 $("missionList").innerHTML=arr.map((m,i)=>`<button class="mission ${i===idx?"active ":""}${set.includes(i)?" done":""}" onclick="selectLesson(${i})"><span class="dot">${set.includes(i)?"✓":i+1}</span><span><strong>${tr(m.title)}</strong><small>${tr(m.sub)}</small></span></button>`).join("");
 const pct=Math.round(set.length/arr.length*100);$("progressBar").style.width=pct+"%";$("progressText").textContent=`${set.length} / ${arr.length} · ${pct}%`;
 $("level").textContent=Math.floor(xp/500)+1;$("xp").textContent=xp;$("doneCount").textContent=Object.values(done).flat().length;
}
function render(){
 const m=L(), saveKey="wq_code_"+course+"_"+idx;
 $("title").textContent=tr(m.title);$("sideTitle").textContent=tr(m.title);$("subtitle").textContent=tr(m.sub);$("sideIntro").textContent=tr(m.intro);
 $("explain").textContent=tr(m.explain);$("sample").textContent=m.sample;$("tip").textContent=tr(m.tip);$("challengeText").textContent=tr(m.challenge);
 $("code").value=localStorage.getItem(saveKey)||m.code;$("feedback").textContent="";$("answer").value="";
 $("fileTab").textContent=course==="html"?"📄 index.html":course==="css"?"🎨 style.html":"⚡ app.html";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=({tagline:["Build the web. One mission at a time.","ابنِ الويب. مهمة واحدة في كل مرة."],level:["Level","المستوى"],missionsDone:["Missions","المهام"],missions:["Missions","المهام"],progress:["Course progress","تقدم الدورة"],livePreview:["Live preview","المعاينة المباشرة"],status:["Lesson status","حالة الدرس"],challenge:["Challenge","التحدي"],check:["Check","تحقق"],learn:["Learn","تعلم"]}[e.dataset.t]||["",""])[lang==="en"?0:1]);
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("enBtn").classList.toggle("active",lang==="en");$("arBtn").classList.toggle("active",lang!=="en");
 renderCourses();renderMissions();updateLines();runPreview();
}
function updateLines(){$("lines").textContent=Array.from({length:$("code").value.split("\n").length},(_,i)=>i+1).join("\n")}
function runPreview(){
 const code=$("code").value;
 const iframe=$("preview");
 if(course==="html"){iframe.srcdoc=code}
 else if(course==="css"){iframe.srcdoc=code.includes("<style")?code:"<style>"+code+"</style><h2>CSS Preview</h2><p>Edit the CSS and run it.</p>"}
 else {iframe.srcdoc=code}
 $("output").innerHTML='<span class="ok">✓ '+(lang==="en"?"Preview updated!":"تم تحديث المعاينة!")+'</span>';
}
function check(){
 const m=L(),ans=$("answer").value.trim().toLowerCase(),code=$("code").value.toLowerCase(),target=m.answer;
 let ok=ans===target || code.includes(target) || (course==="html"&&code.includes("<h1")&&code.includes("<p")) || (course==="css"&&code.includes("style")) || (course==="js"&&code.includes("<script")&&code.includes("document"));
 if(ok){done[course]=done[course]||[];if(!done[course].includes(idx)){done[course].push(idx);xp+=m.xp;save()}$("feedback").innerHTML=`<span class="ok">✓ ${lang==="en"?"Mission complete!":"اكتملت المهمة!"} +${m.xp} XP</span>`;renderMissions()}
 else $("feedback").innerHTML=`<span class="err">💡 ${lang==="en"?"Not yet — edit the code and try again.":"ليس بعد — عدّل الكود وحاول مرة أخرى."}</span>`;
}
function selectLesson(i){idx=i;render()}
document.querySelectorAll(".course").forEach(b=>b.onclick=()=>{course=b.dataset.course;idx=0;render()});
$("runBtn").onclick=runPreview;$("checkBtn").onclick=check;
$("resetBtn").onclick=()=>{$("code").value=L().code;localStorage.removeItem("wq_code_"+course+"_"+idx);updateLines();runPreview()};
$("saveBtn").onclick=()=>{localStorage.setItem("wq_code_"+course+"_"+idx,$("code").value);$("feedback").innerHTML='<span class="ok">✓ Saved!</span>'};
$("code").addEventListener("input",updateLines);$("code").addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();let s=e.target.selectionStart;e.target.value=e.target.value.slice(0,s)+"    "+e.target.value.slice(e.target.selectionEnd);e.target.selectionStart=e.target.selectionEnd=s+4;updateLines()}if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runPreview()}});
$("enBtn").onclick=()=>{lang="en";render()};$("arBtn").onclick=()=>{lang="ar";render()};render();
</script>
</body>
</html>
